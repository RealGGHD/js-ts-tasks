<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML CSS Task</title>

    <link rel="stylesheet" href="./style.css" />
    <script src="./iphone.js"></script>
  </head>
  <body>
    <iphone-frame>
      <div class="topBar">
        <img src="Back.svg" alt="Back">
        <h1>user_name</h1>
        <img src="Options.svg" alt="Options">
      </div>
      <div class="profile">
        <img class="logo" src="Logo.svg" alt="Logo">
        <h2 class="postNum">129<br>Posts</h2>
        <h2 class="followerNum">3680<br>Followers</h2>
        <h2 class="followingNum">230<br>Following</h2>
      </div>
      <div class="about">
        <span class="upperText">Name</span>
        <span class="middleText">Local business</span>
        <span class="lowText">www.website.com</span>
      </div>
      <div class="actions">
        <button class="followButton" type="button">Follow</button>
        <button class="messageButton" type="button">Message</button>
        <button class="emailButton" type="button">Email</button>
        <button class="moreButton" type="button"><img src="More.svg" alt="More"></button>
      </div>
      <div class="higlights">
        <p>
          <img src="highlight1.svg" alt="Highlights1" width="55">
          Highlight
        </p>
        <p>
          <img src="highlight2.svg" alt="Highlights2" width="55">
          Highlight
        </p>
        <p>
          <img src="highlight3.svg" alt="Highlights3" width="55">
          Highlight
        </p>
        <p>
          <img src="highlight4.svg" alt="Highlights4" width="55">
          Highlight
        </p>
      </div>
      <div class="photos1">
        <img src="photo1.svg" alt="Photo1" width="119">
        <img src="photo2.svg" alt="Photo2" width="119">
        <img src="photo3.svg" alt="Photo3" width="119">
      </div>
      <div class="photos2">
        <img src="photo4.svg" alt="Photo4" width="119">
        <img src="photo5.svg" alt="Photo5" width="119">
        <img src="photo6.svg" alt="Photo6" width="119">
      </div>
      <div class="photos3">
        <img src="photo7.svg" alt="Photo7" width="119">
        <img src="photo8.svg" alt="Photo8" width="119">
        <img src="photo9.svg" alt="Photo9" width="119">
      </div>
      <div class="photos4">
        <img src="photo10.svg" alt="Photo10" width="119">
        <img src="photo11.svg" alt="Photo11" width="119">
        <img src="photo12.svg" alt="Photo12" width="119">
      </div>
      <div class="bottom-bar">
        <img class="home" src="lowbar1.svg" alt="Lowbar1" width="30">
        <img src="lowbar2.svg" alt="Lowbar2" width="30">
        <img src="lowbar3.svg" alt="Lowbar3" width="30">
        <img src="lowbar4.svg" alt="Lowbar3" width="30">
        <img src="lowbar5.svg" alt="Lowbar3" width="30">
      </div>
    </iphone-frame>
  </body>
</html>
